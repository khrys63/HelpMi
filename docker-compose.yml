version: '3.8'

services:
  mariadb:
    image: mariadb:11
    environment:
      MYSQL_DATABASE: helpmi
      MYSQL_USER: helpmi
      MYSQL_PASSWORD: helpmi_pass
      MYSQL_ROOT_PASSWORD: root_pass
    volumes:
      - mariadb_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  phpmyadmin:
    image: phpmyadmin:latest
    environment:
      PMA_HOST: mariadb
      PMA_USER: helpmi
      PMA_PASSWORD: helpmi_pass
    ports:
      - "8081:80"
    depends_on:
      mariadb:
        condition: service_healthy

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    command: start-dev --import-realm
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json
    ports:
      - "8180:8080"

  backend:
    build: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:mariadb://mariadb:3306/helpmi
      SPRING_DATASOURCE_USERNAME: helpmi
      SPRING_DATASOURCE_PASSWORD: helpmi_pass
      APP_KEYCLOAK_ISSUER_URI: http://keycloak:8080/realms/helpmi
      APP_STORAGE_PATH: /app/uploads
    volumes:
      - uploads_data:/app/uploads
    ports:
      - "8080:8080"
    depends_on:
      mariadb:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
        VITE_DEV_MODE: "false"
        VITE_KEYCLOAK_URL: http://localhost:8180
        VITE_KEYCLOAK_REALM: helpmi
        VITE_KEYCLOAK_CLIENT_ID: helpmi-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mariadb_data:
  uploads_data:
