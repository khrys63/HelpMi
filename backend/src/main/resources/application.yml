spring:
  application:
    name: helpmi-backend
  data:
    web:
      pageable:
        max-page-size: 100
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB
  flyway:
    enabled: true
    locations: classpath:db/migration
  mail:
    host:     ${APP_MAIL_HOST:localhost}
    port:     ${APP_MAIL_PORT:1025}
    username: ${APP_MAIL_USERNAME:}
    password: ${APP_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${APP_MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${APP_MAIL_STARTTLS:false}

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

app:
  storage:
    s3:
      endpoint:   ${APP_S3_ENDPOINT:http://localhost:9000}
      region:     ${APP_S3_REGION:us-east-1}
      bucket:     ${APP_S3_BUCKET:helpmi}
      access-key: ${APP_S3_ACCESS_KEY:minioadmin}
      secret-key: ${APP_S3_SECRET_KEY:minioadmin}
  security:
    disabled: false
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  mail:
    from:     ${APP_MAIL_FROM:noreply@helpmi.local}
    base-url: ${APP_BASE_URL:http://localhost:5173}
