spring:
  application:
    name: helpmi-backend
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MariaDBDialect
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

app:
  storage:
    path: ${APP_STORAGE_PATH:./uploads}
  security:
    disabled: false
