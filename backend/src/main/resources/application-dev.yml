spring:
  datasource:
    url: jdbc:mariadb://localhost:3306/helpmi
    username: helpmi
    password: helpmi_pass
  jpa:
    show-sql: false
  flyway:
    locations: classpath:db/migration,classpath:db/dev-seed
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${APP_KEYCLOAK_ISSUER_URI:http://auth.localhost/realms/helpmi}

app:
  storage:
    s3:
      access-key: ${APP_S3_ACCESS_KEY:helpmi}
      secret-key: ${APP_S3_SECRET_KEY:helpmi_minio_pass}
  mail:
    from:     noreply@helpmi.local
    base-url: http://localhost:5173
